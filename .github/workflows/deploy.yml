name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main # 只有在 push 到 main 分支时才触发部署

# 设置 GITHUB_TOKEN 的权限，允许写入仓库内容（用于发布到 gh-pages 分支）
permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }} # 防止并发部署冲突
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build VitePress site (官网)
        run: pnpm run docs:build

      - name: Assemble publish directory
        run: |
          rm -rf publish
          mkdir -p publish/docs
          if [ -d unpackage/dist/build/web ]; then
            cp -r unpackage/dist/build/web/. publish/
          fi
          cp -r docs/.vitepress/dist/. publish/docs/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          force_orphan: true # 一次性发布官网 + H5 演示站，避免两个 workflow 互相覆盖
