# ==========================================
# unibestX H5 部署示例（nginx，静态托管 + 可选反向代理）
# 用法：把本文件放到 nginx 配置目录（如 /etc/nginx/conf.d/unibestx.conf），
#       修改下方 root / server_name 后执行 nginx -s reload
# 前置：pnpm env:test / pnpm env:prod 后 pnpm build:h5，产物在 unpackage/dist/build/web
# 说明：H5 走代理模式（.env 里 VITE_H5_USE_PROXY=true）时启用下方 /api 反代；
#       直连模式（false）不需要这段，可删掉
# ==========================================

server {
    listen 80;
    server_name your-domain.com;          # 改成你的域名 / IP

    # ---- H5 静态产物 ----
    root /opt/unibestX/unpackage/dist/build/web;
    index index.html;

    location / {
        # 项目是 hash 路由，直接找静态文件即可；try_files 兜底防止刷新 404
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（assets 带 hash，可放心长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 可选：H5 走代理模式时启用（VITE_H5_USE_PROXY=true）----
    # 不带末尾 / 会保留 /api 前缀转发（如后端接口是 /api/xxx 就选这个）
    # 后端不带 /api 前缀时，把 proxy_pass 改成 http://127.0.0.1:3000/ 即可去掉前缀
    location /api/ {
        proxy_pass http://127.0.0.1:3000;  # 改成你的后端地址
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后端超时较长（如文件上传）时按需调整
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
