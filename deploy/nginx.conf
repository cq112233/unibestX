# ==========================================
# unibestX H5 生产部署 Nginx 配置
# - Docker 模式：容器启动时由官方 entrypoint 自动用环境变量替换 ${API_UPSTREAM}
# - 裸机模式：可将 ${API_UPSTREAM} 直接替换为具体后端地址（如 https://ukw0y1.laf.run）
# ==========================================

server {
    listen 80;
    server_name localhost;

    # H5 静态产物目录（Docker 容器内路径）
    root /usr/share/nginx/html;
    index index.html;

    # 启用 Gzip 压缩，加速首屏加载
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # SPA Hash 路由兼容：静态资源优先，兜底回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长期缓存（带 hash 的 js/css/assets）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端接口动态反向代理
    # Docker 容器启动时由 envsubst 将 ${API_UPSTREAM} 替换为对应环境变量
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 禁止访问敏感文件及目录
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
